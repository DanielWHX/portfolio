<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Lyntra adaptive AI scheduling workflow</title>
  <desc id="desc">A natural-language scheduling request is interpreted, checked against the calendar, adjusted to avoid conflicts while preserving duration, and saved for review. Verified example: a one-hour task at 14:00 is requested at 10:00. With a meeting from 10:00 to 11:00, the task is saved at 11:00 to 12:00 in automatic conflict-resolution mode.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#879bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 9 5.5 2 9" fill="none" stroke="#4b83e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172d47}
      .eyebrow{font-size:22px;font-weight:700;letter-spacing:2px;fill:#4b83e6}
      .title{font-size:50px;font-weight:700;letter-spacing:-1.8px}
      .subtitle{font-size:26px;fill:#58718d}
      .card-title{font-size:27px;font-weight:700;letter-spacing:-.6px}
      .body{font-size:22px;fill:#58718d}
      .number{font-size:22px;font-weight:700;fill:#8498b0}
      .icon{fill:none;stroke:#4b83e6;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .line{fill:none;stroke:#879bb2;stroke-width:2;marker-end:url(#arrow)}
      .small-title{font-size:22px;font-weight:700;fill:#58718d}
      .time{font-size:35px;font-weight:700;letter-spacing:-1px}
    </style>
  </defs>
  <rect width="1280" height="920" rx="28" fill="#f5f8fc"/>
  <path d="M48 167H1232" stroke="#dce6f1" stroke-width="1.5"/>
  <text x="48" y="53" class="eyebrow">LYNTRA / CORE WORKFLOW</text>
  <text x="48" y="113" class="title">Adaptive AI scheduling</text>
  <text x="48" y="149" class="subtitle">From a simple request to a calendar change that fits.</text>

  <!-- Five steps, connected in one reading direction. -->
  <g transform="translate(48 208)">
    <rect width="212" height="252" rx="20" fill="#fff" stroke="#dae4ef" stroke-width="1.5"/>
    <text x="168" y="40" class="number">01</text>
    <g class="icon" transform="translate(24 28)"><path d="M4 2h34a5 5 0 0 1 5 5v22a5 5 0 0 1-5 5H18L7 44V34H4a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Z"/><path d="M9 13h24M9 23h16"/></g>
    <text x="24" y="116" class="card-title"><tspan x="24">Request</tspan><tspan x="24" dy="33">a change</tspan></text>
    <text x="24" y="203" class="body"><tspan x="24">Use everyday</tspan><tspan x="24" dy="29">language</tspan></text>
  </g>
  <path d="M266 334H285" class="line"/>
  <g transform="translate(292 208)">
    <rect width="212" height="252" rx="20" fill="#fff" stroke="#dae4ef" stroke-width="1.5"/>
    <text x="168" y="40" class="number">02</text>
    <g class="icon" transform="translate(24 28)"><path d="M20 1 25 15 39 20 25 25 20 39 15 25 1 20 15 15Z"/><path d="m40 1 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/></g>
    <text x="24" y="116" class="card-title"><tspan x="24">Interpret</tspan><tspan x="24" dy="33">intent</tspan></text>
    <text x="24" y="203" class="body"><tspan x="24">Identify the task</tspan><tspan x="24" dy="29">and target time</tspan></text>
  </g>
  <path d="M510 334H529" class="line"/>
  <g transform="translate(536 208)">
    <rect width="212" height="252" rx="20" fill="#fff" stroke="#dae4ef" stroke-width="1.5"/>
    <text x="168" y="40" class="number">03</text>
    <g class="icon" transform="translate(24 28)"><rect x="1" y="7" width="43" height="36" rx="5"/><path d="M11 1v12M34 1v12M1 19h43M11 28h7M27 28h7M11 36h7"/></g>
    <text x="24" y="116" class="card-title"><tspan x="24">Check the</tspan><tspan x="24" dy="33">calendar</tspan></text>
    <text x="24" y="203" class="body"><tspan x="24">Read busy time</tspan><tspan x="24" dy="29">and constraints</tspan></text>
  </g>
  <path d="M754 334H773" class="line"/>
  <g transform="translate(780 208)">
    <rect width="212" height="252" rx="20" fill="#eaf2ff" stroke="#b8cef1" stroke-width="1.5"/>
    <text x="168" y="40" class="number" style="fill:#4b83e6">04</text>
    <g class="icon" transform="translate(24 28)"><path d="M2 11h33M28 4l8 7-8 7M44 33H11M17 26l-8 7 8 7"/><path d="M2 26v14M44 4v14"/></g>
    <text x="24" y="116" class="card-title"><tspan x="24">Resolve</tspan><tspan x="24" dy="33">conflicts</tspan></text>
    <text x="24" y="203" class="body"><tspan x="24">Find a free slot</tspan><tspan x="24" dy="29">Keep duration</tspan></text>
  </g>
  <path d="M998 334H1017" class="line"/>
  <g transform="translate(1024 208)">
    <rect width="208" height="252" rx="20" fill="#edf8f5" stroke="#beded8" stroke-width="1.5"/>
    <text x="164" y="40" class="number" style="fill:#248d82">05</text>
    <g class="icon" style="stroke:#248d82" transform="translate(24 28)"><circle cx="22" cy="22" r="21"/><path d="m12 22 7 8 15-17"/></g>
    <text x="24" y="116" class="card-title"><tspan x="24">Save and</tspan><tspan x="24" dy="33">review</tspan></text>
    <text x="24" y="203" class="body"><tspan x="24">Show confirmed</tspan><tspan x="24" dy="29">calendar state</tspan></text>
  </g>

  <!-- A concrete, verified scenario explains the business value. -->
  <rect x="48" y="506" width="1184" height="316" rx="22" fill="#fff" stroke="#dbe5f0" stroke-width="1.5"/>
  <text x="78" y="550" class="small-title">A REAL SCHEDULING EXAMPLE</text>
  <rect x="1040" y="526" width="162" height="36" rx="18" fill="#f0f5fc"/>
  <text x="1121" y="551" text-anchor="middle" font-size="22" fill="#58718d">Auto mode</text>
  <text x="78" y="591" font-size="28" font-weight="700">“Move my 14:00 task to 10:00.”</text>

  <g transform="translate(78 617)">
    <rect width="320" height="171" rx="15" fill="#f5f8fc"/>
    <text x="22" y="37" class="small-title">ORIGINAL TASK</text>
    <text x="22" y="87" class="time">14:00–15:00</text>
    <text x="22" y="137" class="body">1 hour to preserve</text>
  </g>
  <path d="M411 702H442" stroke="#4b83e6" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <g transform="translate(456 617)">
    <rect width="336" height="171" rx="15" fill="#f1f5fb"/>
    <text x="22" y="37" class="small-title">REQUESTED SLOT</text>
    <text x="22" y="87" class="time">10:00–11:00</text>
    <text x="22" y="137" class="body">Meeting already booked</text>
  </g>
  <path d="M805 702H836" stroke="#4b83e6" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <g transform="translate(850 617)">
    <rect width="352" height="171" rx="15" fill="#edf8f5"/>
    <text x="22" y="37" class="small-title" style="fill:#248d82">SAVED RESULT</text>
    <text x="22" y="87" class="time" style="fill:#248d82">11:00–12:00</text>
    <text x="22" y="137" class="body">Free slot · same duration</text>
  </g>
  <circle cx="61" cy="869" r="5" fill="#4b83e6"/>
  <text x="80" y="878" font-size="24" fill="#58718d">AI interprets the request. Application logic checks and saves the change.</text>
</svg>
